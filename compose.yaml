services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=scrt-main-db'
      - 'POSTGRES_PASSWORD=1213'
      - 'POSTGRES_USER=gorbokonyk'
      - 'TZ=Europe/Kyiv'
      - 'PGTZ=Europe/Kyiv'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorbokonyk -d scrt-main-db"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: 'adminer:latest'
    ports:
      - '8081:8080'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ADMINER_DEFAULT_SERVER=postgres