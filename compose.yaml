services:
  postgres-identity:
    image: 'postgres:17'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrt_identity}
      POSTGRES_USER: ${POSTGRES_USER:-scrt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: 'adminer:5'
    ports:
      - '127.0.0.1:8081:8080'
    depends_on:
      postgres-identity:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres-identity

volumes:
  postgres-identity-data: