spring.application.name=identity-service
server.port=8080

spring.docker.compose.file=compose.yaml

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.liquibase.change-log=classpath:db/changelog/changelog.yaml

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

scrt.bff.client-secret=${BFF_CLIENT_SECRET:dev-secret-change-me}
scrt.bff.redirect-uri=${BFF_REDIRECT_URI:http://localhost:8082/login/oauth2/code/scrt}
scrt.issuer=${ISSUER_URI:http://localhost:8080}